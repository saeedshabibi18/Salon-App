<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SalonPro — Salon Management</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f1f6; --border:#e3e5ee;
  --text:#1c2030; --muted:#6b7189; --primary:#7c5cff; --primary-d:#6a49f2;
  --primary-soft:#efeaff; --success:#1fb673; --success-soft:#e2f7ee;
  --warn:#f0a020; --warn-soft:#fdf1dc; --danger:#e5484d; --danger-soft:#fdecec;
  --info:#3b82f6; --shadow:0 1px 3px rgba(20,20,50,.06),0 8px 24px rgba(20,20,50,.06);
  --radius:14px; --radius-sm:10px;
}
[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e2a; --surface-2:#232736; --border:#2c3143;
  --text:#e8eaf2; --muted:#9096ad; --primary:#8b6dff; --primary-d:#7c5cff;
  --primary-soft:#2a2547; --success:#2fce85; --success-soft:#173a2c;
  --warn:#f0a020; --warn-soft:#3a2f16; --danger:#f0595e; --danger-soft:#3a1f21;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"]{font-family:"Segoe UI","Tahoma",-apple-system,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}
.hidden{display:none !important}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
.sidebar{
  width:236px;background:var(--surface);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#b18bff);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .bn{font-weight:700;font-size:15px;line-height:1.1}
.brand .bs{font-size:11px;color:var(--muted)}
.nav{padding:8px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--muted);font-weight:500;margin-bottom:2px;transition:.12s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--primary-soft);color:var(--primary-d)}
.nav a .ic{width:18px;text-align:center;font-size:16px}
.nav .sep{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  padding:14px 12px 6px;font-weight:700;opacity:.7}
.sb-foot{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px;font-weight:700}
.topbar .spacer{flex:1}
.content{padding:22px;flex:1}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);padding:9px 15px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.success{background:var(--success);border-color:var(--success);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.icon{padding:8px;width:36px;height:36px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Cards / layout ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .chip{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:17px}

.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:16px;font-weight:700}
.section-head .spacer{flex:1}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.t-wrap{overflow-x:auto}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:700}
.badge.b-green{background:var(--success-soft);color:var(--success)}
.badge.b-orange{background:var(--warn-soft);color:var(--warn)}
.badge.b-red{background:var(--danger-soft);color:var(--danger)}
.badge.b-purple{background:var(--primary-soft);color:var(--primary-d)}
.badge.b-gray{background:var(--surface-2);color:var(--muted)}
.badge.b-blue{background:#e5efff;color:var(--info)}
[data-theme="dark"] .badge.b-blue{background:#1b2c4a}

.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-d);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--text)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none;transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:70px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
.inline-in{display:flex;gap:8px;align-items:center}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,17,30,.5);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:560px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.lg{max-width:820px}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700;flex:1}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:22px;inset-inline-end:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);
  border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow);min-width:240px;
  animation:slidein .2s ease;font-weight:500}
.toast.ok{border-inline-start-color:var(--success)}
.toast.err{border-inline-start-color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- Misc ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:0 12px}
.searchbar input{border:none;background:transparent;padding:9px 0;box-shadow:none}
.searchbar input:focus{box-shadow:none}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--radius-sm);flex-wrap:wrap}
.tabs button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;
  color:var(--muted);font-size:13px}
.tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.pill{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);
  font-weight:600;font-size:13px;color:var(--muted)}
.pill.active{background:var(--primary);border-color:var(--primary);color:#fff}

.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-row .name{width:130px;font-size:13px;font-weight:600;flex-shrink:0}
.bar-track{flex:1;height:12px;background:var(--surface-2);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#b18bff);border-radius:20px}
.bar-val{width:90px;text-align:end;font-size:13px;font-weight:700;flex-shrink:0}

.cal-day{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;min-height:90px;background:var(--surface)}
.cal-slot{font-size:11.5px;background:var(--primary-soft);color:var(--primary-d);border-radius:6px;
  padding:3px 6px;margin-bottom:4px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* line items */
.li-table td{padding:8px}
.li-table input,.li-table select{padding:7px 9px}

/* invoice print */
.invoice-print{background:#fff;color:#1c2030;padding:30px;border-radius:8px;font-size:13px}
.invoice-print h2{color:#1c2030}
.invoice-print table th,.invoice-print table td{border-color:#e3e5ee}
.inv-tot{display:flex;justify-content:space-between;padding:5px 0}
.inv-tot.grand{font-size:18px;font-weight:800;border-top:2px solid #1c2030;margin-top:6px;padding-top:10px}

/* first run */
.welcome{max-width:720px;margin:40px auto}
.demo-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.14s;background:var(--surface)}
.demo-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.demo-card .flag{font-size:30px}
.demo-card h4{font-size:15px;margin:8px 0 4px}

@media(max-width:860px){
  .sidebar{position:fixed;z-index:60;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  .form-grid{grid-template-columns:1fr}
  #menuBtn{display:inline-flex !important}
}
#menuBtn{display:none}
</style>

function genRefCode(name,id){ return ((name||"REF").replace(/[^A-Za-z]/g,"").slice(0,4).toUpperCase()||"REF")+String(id||"").slice(-3).toUpperCase(); }

function ensureDefaults(){
  const d=defaultDB().settings, s=DB.settings;
  for(const k in d){ if(s[k]===undefined) s[k]=d[k]; }
  if(!s.hours) s.hours=defaultHours();

  ["confirm","reminder","review"].forEach(k=>{ if(!s.templates[k]) s.templates[k]=defaultTemplates()[k]; });

/* generate available start times for a date, staff (""=any), given service duration */
function slotsFor(dateISO,staffId,durationMin){

  if(!h||h.closed) return [];
  const step=DB.settings.bookingSlotMinutes||30, dur=durationMin||30;
  const [oh,om]=h.open.split(":").map(Number), [ch,cm]=h.close.split(":").map(Number);

  const isToday=dateISO===todayISO(), cur=nowMinutes();
  const res=[];
  for(let m=openMin;m+dur<=closeMin;m+=step){
    if(isToday&&m<=cur+15) continue; // no past / too-soon slots today
    const s=m,e=m+dur;
    const overlaps=appts.filter(a=>{
      const sv=byId(DB.services,a.serviceId); const ad=sv?(sv.duration||30):30;
      const [ah,am]=a.time.split(":").map(Number); const as=ah*60+am, ae=as+ad;
      if(!(s<ae&&as<e)) return false;
      return staffId? a.staffId===staffId : true;
    });
    if(staffId? overlaps.length===0 : overlaps.length<staffCount) res.push(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"));
  }
  return res;
}
function fillTemplate(kind,appt){
  const c=byId(DB.clients,appt.clientId), sv=byId(DB.services,appt.serviceId), st=byId(DB.staff,appt.staffId);
  const lang=DB.settings.lang||"en";
  const tpl=((DB.settings.templates||{})[kind]||{})[lang]||((DB.settings.templates||{})[kind]||{}).en||"";
  const staffStr=st?((lang==="ar"?" مع ":" with ")+st.name):"";
  return tpl.replace(/{name}/g,c?c.name:"").replace(/{salon}/g,DB.settings.salonName||"")
    .replace(/{service}/g,sv?sv.name:"").replace(/{date}/g,fmtDate(appt.date))
    .replace(/{time}/g,fmtTime(appt.time)).replace(/{staff}/g,staffStr);
}

/* ---- Tier 1: offline smart suggestions (no API key needed) ---- */
function smartSuggestions(){
  const out=[], today=todayISO();
  DB.clients.forEach(c=>{
    const paid=DB.invoices.filter(i=>i.clientId===c.id&&i.status==="paid").map(i=>i.date).sort();
    const last=paid[paid.length-1];
    if(last){ const days=Math.round((new Date(today)-new Date(last))/86400000); if(days>=42) out.push({type:"rebook",clientId:c.id,days}); }
  });
  for(let d=1;d<=7;d++){ const day=daysFromISO(d); const n=DB.appointments.filter(a=>a.date===day&&a.status!=="cancelled").length; if(n<=1) out.push({type:"quiet",date:day,count:n}); }
  return out;
}

function bookConfirm(){
  const name=val("bk_name"), phone=val("bk_phone"), email=val("bk_email");
  if(!name||!phone) return toast(t("required"),"err");
  const address=val("bk_address"), referral=val("bk_ref");
  if(cloudOn()){
    const sv=byId(DB.services,bk.serviceId), st=byId(DB.staff,bk.staffId);
    SalonProCloud.submitBooking({name,phone,email,notes:val("bk_notes"),serviceId:bk.serviceId,staffId:bk.staffId,
      date:bk.date,time:bk.time,serviceName:sv?sv.name:"",staffName:st?st.name:"",address,referral})
      .then(()=>{ bk.done="cloud"; render(); }).catch(()=>toast(t("required"),"err"));
    return;
  }
  let c=DB.clients.find(x=>digits(x.phone)&&digits(x.phone)===digits(phone));
  if(!c){ c={id:uid("cl"),name,phone,email,notes:"",points:0,created:todayISO()}; c.refCode=genRefCode(c.name,c.id); DB.clients.push(c); awardReferral(referral,c); }
  else if(email&&!c.email) c.email=email;
  const appt={id:uid("appt"),clientId:c.id,serviceId:bk.serviceId,staffId:bk.staffId,date:bk.date,time:bk.time,
    status:"booked",source:"online",reminded:false,notes:val("bk_notes"),address};
  DB.appointments.push(appt); save(); bk.done=appt.id; render();
}

  const a = bk.done!=="cloud" ? byId(DB.appointments,bk.done) : {serviceId:bk.serviceId,date:bk.date,time:bk.time,staffId:bk.staffId};

function emptyBlock(icon,msg){ return `<div class="empty"><div class="big">${icon}</div>${esc(msg)}<div style="font-size:12px;margin-top:4px">${t("getStarted")}</div></div>`; }
function statusBadge(s){
  const map={booked:["b-blue","booked"],confirmed:["b-purple","confirmed"],completed:["b-green","completed"],
    cancelled:["b-red","cancelled"],noshow:["b-orange","noshow"]};
  const [cls,key]=map[s]||["b-gray",s]; return `<span class="badge ${cls}">${esc(t(key))}</span>`;
}
function remindersDue(){
  const today=todayISO(), tom=daysFromISO(1);
  return DB.appointments.filter(a=>(a.date===today||a.date===tom)&&(a.status==="booked"||a.status==="confirmed")&&!a.reminded)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

function renderRequestsCard(){
  if(!cloudOn() || !cloudRequests.length) return "";
  return `<div class="card pad" style="margin-bottom:18px;border-inline-start:4px solid var(--success)">
    <div class="section-head"><h2>🌐 ${t("incomingBookings")}</h2><div class="spacer"></div><span class="badge b-green">${cloudRequests.length}</span></div>
    <div class="t-wrap"><table><tbody>
    ${cloudRequests.map(r=>{const p=r.payload||{};return `<tr>
      <td><div class="row" style="gap:9px"><div class="avatar">${initials(p.name)}</div><div>${esc(p.name||"—")}<div class="muted" style="font-size:12px">${esc(p.phone||"")}</div></div></div></td>
      <td>${p.type==="cancel"?`<span class="badge b-red">${t("cancelRequest")}</span>`:`${esc(p.serviceName||"")}<div class="muted" style="font-size:12px">${fmtDate(p.date)} ${fmtTime(p.time)}${p.staffName?" • "+esc(p.staffName):""}</div>`}</td>
      <td style="text-align:end"><div class="row" style="justify-content:flex-end;gap:6px">
        <button class="btn sm success" onclick="acceptCloudRequest('${r.id}')">✓ ${t("accept")}</button>
        <button class="btn sm ghost" title="${t("declineWord")}" onclick="declineCloudRequest('${r.id}')">✕</button></div></td></tr>`;}).join("")}
    </tbody></table></div></div>`;
}
function acceptCloudRequest(id){
  const req=cloudRequests.find(r=>r.id===id); if(!req) return;
  const p=req.payload||{};
  if(p.type==="cancel"){
    const cc=DB.clients.find(x=>digits(x.phone)&&digits(x.phone)===digits(p.phone)); const today=todayISO();
    if(cc){ DB.appointments.forEach(a=>{ if(a.clientId===cc.id&&a.date>=today&&a.status!=="completed"&&a.status!=="cancelled") a.status="cancelled"; }); save(); }
    if(window.SalonProCloud&&SalonProCloud.updateRequest){ SalonProCloud.updateRequest(id,"accepted"); }
    cloudRequests=cloudRequests.filter(r=>r.id!==id); render(); toast(t("cancelDone"),"ok"); return;
  }
  let c=DB.clients.find(x=>digits(x.phone)&&digits(x.phone)===digits(p.phone));
  if(!c){ c={id:uid("cl"),name:p.name||"Customer",phone:p.phone||"",email:p.email||"",notes:p.notes||"",points:0,created:todayISO()}; c.refCode=genRefCode(c.name,c.id); DB.clients.push(c); awardReferral(p.referral,c); }
  DB.appointments.push({id:uid("appt"),clientId:c.id,serviceId:p.serviceId,staffId:p.staffId||"",date:p.date,time:p.time,
    status:"booked",source:"online",reminded:false,notes:p.notes||"",address:p.address||""});
  save();
  if(window.SalonProCloud && SalonProCloud.updateRequest){ try{ SalonProCloud.updateRequest(id,"accepted"); }catch(e){} }
  cloudRequests=cloudRequests.filter(r=>r.id!==id);
  render(); toast(t("saved"),"ok");
}
function declineCloudRequest(id){
  if(window.SalonProCloud && SalonProCloud.updateRequest){ try{ SalonProCloud.updateRequest(id,"declined"); }catch(e){} }
  cloudRequests=cloudRequests.filter(r=>r.id!==id);
  render(); toast(t("deleted"));
}
function onlineAlert(){
  const today=todayISO();
  const n=DB.appointments.filter(a=>a.source==="online"&&a.date>=today&&a.status!=="cancelled"&&a.status!=="completed").length;

  return `<div class="card pad" style="margin-bottom:18px;border-inline-start:4px solid var(--primary);display:flex;align-items:center;gap:12px">
    <div style="font-size:22px">🌐</div><div><b>${n}</b> ${n===1?t("newOnlineOne"):t("newOnlineMany")}</div>

}

function messageModal(id){
  const a=byId(DB.appointments,id), c=byId(DB.clients,a.clientId);
  const ch=DB.settings.notifyChannel||"whatsapp";
  const chLabel=ch==="whatsapp"?t("whatsapp"):ch==="sms"?t("sms"):t("emailCh");

  let list=[...DB.appointments].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

function apptModal(id){
  const a=id?byId(DB.appointments,id):null;

  const svcOpts=DB.services.map(s=>`<option value="${s.id}" ${a&&a.serviceId===s.id?"selected":""}>${esc(s.name)} — ${money(s.price)}</option>`).join("");
  const staffOpts=`<option value="">—</option>`+DB.staff.map(s=>`<option value="${s.id}" ${a&&a.staffId===s.id?"selected":""}>${esc(s.name)}</option>`).join("");
  const stOpts=["booked","confirmed","completed","cancelled","noshow"].map(s=>`<option value="${s}" ${a&&a.status===s?"selected":(!a&&s==="booked"?"selected":"")}>${t(s)}</option>`).join("");

      <div class="field"><label>${t("date")} *</label><input type="date" id="f_date" value="${a?a.date:todayISO()}"></div>
      <div class="field"><label>${t("time")} *</label><input type="time" id="f_time" value="${a?a.time:"10:00"}"></div>

function saveAppt(id){
  const cid=val("f_client"), sid=val("f_service"), date=val("f_date"), time=val("f_time");
  if(!cid||!sid||!date||!time) return toast(t("required"),"err");
  const prev=id?byId(DB.appointments,id):null;
  const rec={id:id||uid("appt"),clientId:cid,serviceId:sid,date,time,
    staffId:val("f_staff"),status:val("f_status"),notes:val("f_notes"),
    source:prev?prev.source:"salon",reminded:prev?prev.reminded:false};
  if(id){const i=DB.appointments.findIndex(a=>a.id===id);DB.appointments[i]=rec;}
  else DB.appointments.push(rec);
  save();closeModal();render();toast(t("saved"),"ok");
}
function delAppt(id){ confirmDialog("",()=>{DB.appointments=DB.appointments.filter(a=>a.id!==id);save();render();toast(t("deleted"));}); }
function completeAppt(id){
  const a=byId(DB.appointments,id); if(!a) return;
  a.status="completed"; save();
  invoiceModal(null,{clientId:a.clientId,serviceId:a.serviceId,staffId:a.staffId,apptId:a.id});
}

  const rec={id:id||uid("st"),name,role:val("st_role"),commission:parseFloat(val("st_comm"))||0,phone:val("st_phone"),email:val("st_email")};
  if(id){const i=DB.staff.findIndex(x=>x.id===id);DB.staff[i]=rec;}else DB.staff.push(rec);
  save();closeModal();render();toast(t("saved"),"ok");
}
function delStaff(id){ confirmDialog("",()=>{DB.staff=DB.staff.filter(s=>s.id!==id);save();render();toast(t("deleted"));}); }

let prodSearch="";
function vProducts(el){
  let list=[...DB.products];
  if(prodSearch){const q=prodSearch.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q)||(p.sku||"").toLowerCase().includes(q));}
  el.innerHTML=`
  <div class="section-head"><div class="spacer"></div>
    <div class="searchbar">🔍<input placeholder="${t("search")}" value="${esc(prodSearch)}" oninput="prodSearch=this.value;debouncedProd()"></div>
    <button class="btn primary" onclick="productModal()">＋ ${t("add")}</button></div>
  <div class="card"><div class="t-wrap"><table><thead><tr>
    <th>${t("name")}</th><th>${t("sku")}</th><th>${t("cost")}</th><th>${t("price")}</th><th>${t("stock")}</th><th style="text-align:end">${t("action")}</th>
  </tr></thead><tbody>
    ${list.length?list.map(p=>`<tr>
      <td>${esc(p.name)}<div class="muted" style="font-size:12px">${esc(p.category||"")}</div></td>
      <td>${esc(p.sku||"—")}</td><td>${money(p.cost||0)}</td><td><b>${money(p.price)}</b></td>
      <td>${p.stock<=(p.lowStock||5)?`<span class="badge b-red">${p.stock} ⚠</span>`:`<span class="badge b-green">${p.stock}</span>`}</td>
      <td style="text-align:end"><button class="btn sm ghost" onclick="productModal('${p.id}')">✏️</button>
        <button class="btn sm ghost" onclick="delProduct('${p.id}')">🗑️</button></td></tr>`).join("")
      :`<tr><td colspan="6">${emptyBlock("📦",t("noProducts"))}</td></tr>`}
  </tbody></table></div></div>`;
}
let _pdt; function debouncedProd(){ clearTimeout(_pdt); _pdt=setTimeout(render,180); }
function productModal(id){
  const p=id?byId(DB.products,id):null;
  openModal(id?t("edit"):t("add")+" "+t("products"),`
    <div class="form-grid">
      <div class="field full"><label>${t("name")} *</label><input id="p_name" value="${p?esc(p.name):""}"></div>
      <div class="field"><label>${t("category")}</label><input id="p_cat" value="${p?esc(p.category||""):""}" placeholder="${t("phProdCat")}"></div>
      <div class="field"><label>${t("sku")}</label><input id="p_sku" value="${p?esc(p.sku||""):""}"></div>
      <div class="field"><label>${t("cost")}</label><input id="p_cost" type="number" min="0" step="0.01" value="${p?p.cost||"":""}"></div>
      <div class="field"><label>${t("price")} *</label><input id="p_price" type="number" min="0" step="0.01" value="${p?p.price:""}"></div>
      <div class="field"><label>${t("stock")}</label><input id="p_stock" type="number" min="0" value="${p?p.stock:0}"></div>
      <div class="field"><label>${t("lowStockAlert")}</label><input id="p_low" type="number" min="0" value="${p?p.lowStock||5:5}"></div>
    </div>`,
    `<button class="btn" onclick="closeModal()">${t("cancel")}</button>
     <button class="btn primary" onclick="saveProduct('${id||""}')">${t("save")}</button>`);
}
function saveProduct(id){
  const name=val("p_name"),price=parseFloat(val("p_price"));
  if(!name||isNaN(price)) return toast(t("required"),"err");
  const rec={id:id||uid("pr"),name,category:val("p_cat"),sku:val("p_sku"),cost:parseFloat(val("p_cost"))||0,
    price,stock:parseInt(val("p_stock"))||0,lowStock:parseInt(val("p_low"))||5};
  if(id){const i=DB.products.findIndex(x=>x.id===id);DB.products[i]=rec;}else DB.products.push(rec);
  save();closeModal();render();toast(t("saved"),"ok");
}
function delProduct(id){ confirmDialog("",()=>{DB.products=DB.products.filter(p=>p.id!==id);save();render();toast(t("deleted"));}); }

  el.innerHTML=`
  <div class="section-head"><div class="row">${f("all",t("all"))}${f("paid",t("paid"))}${f("unpaid",t("unpaid"))}</div>
    <div class="spacer"></div><button class="btn primary" onclick="invoiceModal()">＋ ${t("newInvoice")}</button></div>
  <div class="card"><div class="t-wrap"><table><thead><tr>
    <th>${t("invoiceNo")}</th><th>${t("client")}</th><th>${t("date")}</th><th>${t("total")}</th><th>${t("status")}</th><th style="text-align:end">${t("action")}</th>
  </tr></thead><tbody>
    ${list.length?list.map(i=>{const c=byId(DB.clients,i.clientId);return `<tr>

        <button class="btn sm ghost" onclick="delInvoice('${i.id}')">🗑️</button></div></td></tr>`;}).join("")
      :`<tr><td colspan="6">${emptyBlock("💳",t("noSalesYet"))}</td></tr>`}
  </tbody></table></div></div>`;
}

let cart=[], posRedeem=null, posPromo=null;
function invoiceModal(id,preset){
  const inv=id?byId(DB.invoices,id):null;
  posRedeem=null; posPromo=null;
  cart = inv?JSON.parse(JSON.stringify(inv.items)):[];
  if(preset&&preset.serviceId){const s=byId(DB.services,preset.serviceId);if(s)cart.push({type:"service",refId:s.id,name:s.name,price:s.price,qty:1,staffId:preset.staffId||""});}
  const clientOpts=`<option value="">${t("walkin")}</option>`+DB.clients.map(c=>`<option value="${c.id}" ${((inv&&inv.clientId===c.id)||(preset&&preset.clientId===c.id))?"selected":""}>${esc(c.name)}</option>`).join("");
  openModal(id?t("invoiceNo")+" #"+inv.no:t("createInvoice"),`
    <div class="form-grid">
      <div class="field"><label>${t("client")}</label><select id="i_client" onchange="renderLoyalty()">${clientOpts}</select></div>
      <div class="field"><label>${t("date")}</label><input type="date" id="i_date" value="${inv?inv.date:todayISO()}"></div>
    </div>
    <div class="section-head" style="margin-top:6px"><h2 style="font-size:14px">${t("items")}</h2><div class="spacer"></div>
      <button class="btn sm" onclick="cartAdd('service')">＋ ${t("service")}</button>
      <button class="btn sm" onclick="cartAdd('product')">＋ ${t("products")}</button></div>
    <div class="t-wrap"><table class="li-table"><thead><tr><th>${t("item")}</th><th style="width:70px">${t("quantity")}</th><th style="width:110px">${t("price")}</th><th style="width:130px">${t("staffMember")}</th><th style="width:90px">${t("amount")}</th><th></th></tr></thead>
      <tbody id="cartBody"></tbody></table></div>
    ${(DB.promos||[]).length?`<div class="inline-in" style="margin-top:12px"><input id="i_promo" placeholder="${t("promoCode")}" style="text-transform:uppercase;max-width:200px"><button class="btn" onclick="applyPromo()">${t("apply")}</button></div>`:""}
    <div class="form-grid" style="margin-top:14px">
      <div class="field"><label>${t("discount")} (${DB.settings.currencySymbol})</label><input type="number" id="i_disc" min="0" step="0.01" value="${inv?inv.discount||0:0}" oninput="renderCartTotals()"></div>
      ${DB.settings.tipEnabled?`<div class="field"><label>${t("tip")} (${DB.settings.currencySymbol})</label><input type="number" id="i_tip" min="0" step="0.01" value="${inv?inv.tip||0:0}" oninput="renderCartTotals()"></div>`:""}
      <div class="field ${DB.settings.tipEnabled?'full':''}"><label>${t("paymentMethod")}</label><select id="i_pay">
        <option value="cash">${t("cash")}</option><option value="card" ${inv&&inv.payment==="card"?"selected":""}>${t("card")}</option>
        <option value="online" ${inv&&inv.payment==="online"?"selected":""}>${t("online")}</option></select></div>
    </div>
    <div id="loyaltyBox"></div>
    <div class="card pad" style="background:var(--surface-2);margin-top:6px" id="totalsBox"></div>`,
    `<button class="btn" onclick="closeModal()">${t("cancel")}</button>
     <button class="btn" onclick="saveInvoice('${id||""}',false)">${t("save")} (${t("unpaid")})</button>
     <button class="btn success" onclick="saveInvoice('${id||""}',true)">💵 ${t("checkout")}</button>`,{lg:true});
  renderCart(); renderLoyalty();
}
function renderLoyalty(){
  const box=document.getElementById("loyaltyBox"); if(!box) return;
  if(!DB.settings.loyaltyEnabled){ box.innerHTML=""; return; }
  const cid=val("i_client"), c=cid?byId(DB.clients,cid):null;
  if(!c||!(c.points>0)){ box.innerHTML=""; return; }
  const worth=c.points*(DB.settings.loyaltyRedeemValue||0);
  box.innerHTML=`<div class="card pad" style="background:var(--primary-soft);margin-top:8px;display:flex;align-items:center;gap:10px">
    <div>⭐ <b>${c.points}</b> ${t("points")} — ${t("worth")} ${money(worth)}</div><div class="spacer"></div>
    ${posRedeem?`<span class="badge b-green">✓</span>`:`<button class="btn sm" onclick="redeemPointsPOS('${c.id}')">${t("redeemPoints")}</button>`}</div>`;
}
function redeemPointsPOS(cid){
  const c=byId(DB.clients,cid); if(!c) return;
  const {sub}=invTotals();
  const use=Math.min(c.points*(DB.settings.loyaltyRedeemValue||0), sub);
  const disc=document.getElementById("i_disc"); if(disc) disc.value=(Math.round(((parseFloat(disc.value)||0)+use)*100)/100);
  posRedeem={cid:c.id,amount:use};
  renderCartTotals(); renderLoyalty();
}
function cartAdd(type){
  if(type==="service"&&!DB.services.length) return toast(t("tAddSvcFirst"),"err");
  if(type==="product"&&!DB.products.length) return toast(t("tAddProdFirst"),"err");
  const src=type==="service"?DB.services[0]:DB.products[0];
  cart.push({type,refId:src.id,name:src.name,price:src.price,qty:1,staffId:""});
  renderCart();
}
function renderCart(){
  const body=document.getElementById("cartBody"); if(!body) return;
  const staffOpts=v=>`<option value="">—</option>`+DB.staff.map(s=>`<option value="${s.id}" ${v===s.id?"selected":""}>${esc(s.name)}</option>`).join("");
  body.innerHTML=cart.map((it,idx)=>{
    const src=it.type==="service"?DB.services:DB.products;
    const opts=src.map(x=>`<option value="${x.id}" ${x.id===it.refId?"selected":""}>${esc(x.name)} — ${money(x.price)}</option>`).join("");
    return `<tr>
      <td><select onchange="cartSetRef(${idx},this.value,'${it.type}')">${opts}</select></td>
      <td><input type="number" min="1" value="${it.qty}" onchange="cart[${idx}].qty=Math.max(1,parseInt(this.value)||1);renderCart()"></td>
      <td><input type="number" min="0" step="0.01" value="${it.price}" onchange="cart[${idx}].price=parseFloat(this.value)||0;renderCart()"></td>
      <td><select onchange="cart[${idx}].staffId=this.value">${staffOpts(it.staffId)}</select></td>
      <td><b>${money(it.price*it.qty)}</b></td>
      <td><button class="btn sm ghost" onclick="cart.splice(${idx},1);renderCart()">✕</button></td></tr>`;
  }).join("")||`<tr><td colspan="6" class="muted" style="text-align:center;padding:16px">${t("noItems")}</td></tr>`;
  renderCartTotals();
}
function cartSetRef(idx,refId,type){
  const src=type==="service"?byId(DB.services,refId):byId(DB.products,refId);
  if(src){cart[idx].refId=refId;cart[idx].name=src.name;cart[idx].price=src.price;} renderCart();
}
function invTotals(){
  const sub=cart.reduce((s,it)=>s+it.price*it.qty,0);
  const disc=parseFloat((document.getElementById("i_disc")||{}).value)||0;
  const tip=parseFloat((document.getElementById("i_tip")||{}).value)||0;
  const taxable=Math.max(0,sub-disc);
  const tax=taxable*(DB.settings.taxRate||0)/100;
  return {sub,disc,tip,tax,total:taxable+tax+tip};
}
function renderCartTotals(){
  const box=document.getElementById("totalsBox"); if(!box) return;
  const {sub,disc,tip,tax,total}=invTotals();
  box.innerHTML=`
    <div class="inv-tot"><span>${t("subtotal")}</span><span>${money(sub)}</span></div>
    ${disc?`<div class="inv-tot"><span>${t("discount")}</span><span>-${money(disc)}</span></div>`:""}
    <div class="inv-tot"><span>${DB.settings.taxLabel} (${DB.settings.taxRate||0}%)</span><span>${money(tax)}</span></div>
    ${tip?`<div class="inv-tot"><span>${t("tip")}</span><span>${money(tip)}</span></div>`:""}
    <div class="inv-tot grand"><span>${t("total")}</span><span>${money(total)}</span></div>`;
}
function saveInvoice(id,paid){
  if(!cart.length) return toast(t("tAddItemFirst"),"err");
  const {sub,disc,tip,tax,total}=invTotals();
  const cid=val("i_client");
  const existing=id?byId(DB.invoices,id):null;
  const no=existing?existing.no:String(DB.settings.invoiceCounter++);
  const rec={id:id||uid("inv"),no,clientId:cid,
    date:val("i_date"),items:JSON.parse(JSON.stringify(cart)),discount:disc,subtotal:sub,tax,tip,total,
    payment:val("i_pay"),status:paid?"paid":(existing?existing.status:"unpaid")};
  if(paid&&(!existing||existing.status!=="paid")){
    rec.items.forEach(it=>{ if(it.type==="product"){const p=byId(DB.products,it.refId); if(p)p.stock=Math.max(0,p.stock-it.qty);} });
    if(DB.settings.loyaltyEnabled&&cid){ const c=byId(DB.clients,cid);
      if(c){ if(posRedeem&&posRedeem.cid===cid){ const used=Math.round(posRedeem.amount/(DB.settings.loyaltyRedeemValue||1)); c.points=Math.max(0,(c.points||0)-used); }
        c.points=(c.points||0)+Math.round(Math.max(0,sub-disc)*(DB.settings.loyaltyEarnRate||0)); } }
    if(posPromo){ const pm=byId(DB.promos,posPromo.id); if(pm) pm.uses=(pm.uses||0)+1; }
  }
  if(id){const i=DB.invoices.findIndex(x=>x.id===id);DB.invoices[i]=rec;}else DB.invoices.push(rec);
  save();closeModal();render();toast(t("saved"),"ok");
}
function markPaid(id){ const i=byId(DB.invoices,id); if(i){i.status="paid";
  i.items.forEach(it=>{if(it.type==="product"){const p=byId(DB.products,it.refId);if(p)p.stock=Math.max(0,p.stock-it.qty);}});
  save();render();toast(t("saved"),"ok");} }
function delInvoice(id){ confirmDialog("",()=>{DB.invoices=DB.invoices.filter(i=>i.id!==id);save();render();toast(t("deleted"));}); }

function payPanelHTML(inv){
  const s=DB.settings;
  if(!s.payEnabled || !s.payLink || inv.status==="paid") return "";
  const link=s.payLink;
  const qr="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=6&data="+encodeURIComponent(link);
  return `<div class="card pad" style="margin-top:14px;background:var(--surface-2)">
    <div class="section-head"><h2 style="font-size:14px">💳 ${t("payments")}</h2><div class="spacer"></div><b>${money(inv.total)}</b></div>
    <div class="row" style="align-items:center;gap:16px">
      <img src="${qr}" alt="QR" style="width:120px;height:120px;border-radius:8px;background:#fff;padding:6px" onerror="this.style.display='none'">
      <div style="flex:1;min-width:180px">
        <div class="muted" style="font-size:12px;margin-bottom:8px">${t("scanToPay")}</div>
        <div class="row">
          <a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">💳 ${t("payNow")}</a>
          <button class="btn" onclick="copyPay()">${t("copyPayLink")}</button>
          ${s.payCheckoutUrl?`<button class="btn success" onclick="cardCheckout('${inv.id}')">💳 ${t("cardCheckout")}</button>`:""}
        </div>
      </div>
    </div>
    <input type="hidden" id="_paylink" value="${esc(link)}">
  </div>`;
}
function copyPay(){ const e=document.getElementById("_paylink"); const v=e?e.value:(DB.settings.payLink||""); try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v); }catch(err){} toast(t("linkCopied"),"ok"); }
function cardCheckout(id){
  const inv=byId(DB.invoices,id), url=DB.settings.payCheckoutUrl; if(!inv||!url) return;
  toast("…","ok");
  fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({amount:Math.round(inv.total*100),currency:(DB.settings.currency||"USD").toLowerCase(),label:t("invoiceNo")+" "+inv.no,invoice:inv.no})})
    .then(r=>r.json()).then(d=>{ if(d&&d.url) window.open(d.url,"_blank"); else toast("Checkout error","err"); })
    .catch(()=>toast("Checkout error","err"));
}
function sendPayLink(id){ const inv=byId(DB.invoices,id); const c=inv?byId(DB.clients,inv.clientId):null; const s=DB.settings;
  if(!c||(!digits(c.phone)&&!c.email)) return toast(t("noPhone"),"err");
  sendVia(c,`${s.salonName}: ${t("payFor")} ${t("invoiceNo")} ${inv.no} — ${money(inv.total)}.\n${s.payLink}`); toast(t("tOpeningEmail"),"ok"); }
function viewInvoice(id){
  const inv=byId(DB.invoices,id); if(!inv) return;
  const c=byId(DB.clients,inv.clientId);
  const canSend=DB.settings.payEnabled&&DB.settings.payLink&&inv.status!=="paid"&&c&&(digits(c.phone)||c.email);
  openModal(t("invoiceNo")+" #"+inv.no, invoiceHTML(inv)+payPanelHTML(inv),
    `<button class="btn" onclick="closeModal()">${t("close")}</button>
     ${c&&c.email?`<button class="btn" onclick="emailInvoice('${id}')">✉️ ${t("emailReceipt")}</button>`:""}
     ${canSend?`<button class="btn" onclick="sendPayLink('${id}')">💬 ${t("sendPayLink")}</button>`:""}
     ${inv.status!=="paid"?`<button class="btn success" onclick="markPaid('${id}');closeModal()">✓ ${t("markPaid")}</button>`:""}
     <button class="btn primary" onclick="printInvoice()">🖨️ ${t("print")}</button>`,{lg:true});
}
function printInvoice(){
  const html=document.getElementById("invPrint").outerHTML;
  const w=window.open("","_blank");
  w.document.write(`<html dir="${DB.settings.lang==="ar"?"rtl":"ltr"}"><head><title>Invoice</title><style>

function emailInvoice(id){
  const inv=byId(DB.invoices,id); const c=byId(DB.clients,inv.clientId); const s=DB.settings;
  const subject=`${s.salonName} — ${t("invoiceUpper")} #${inv.no}`;
  let body=`${c?c.name:""}\n\n${t("thankYou")} ${s.salonName}.\n\n${t("invoiceNo")} ${inv.no} — ${fmtDate(inv.date)}\n`;
  body+="----------------------------------------\n";
  inv.items.forEach(it=>{ body+=`${it.name}  x${it.qty}   ${money(it.price*it.qty)}\n`; });
  body+="----------------------------------------\n";
  body+=`${t("subtotal")}: ${money(inv.subtotal)}\n`;
  if(inv.discount) body+=`${t("discount")}: -${money(inv.discount)}\n`;
  body+=`${s.taxLabel} (${s.taxRate}%): ${money(inv.tax)}\n`;
  body+=`${t("total")}: ${money(inv.total)}  (${inv.status==="paid"?t("paidStamp"):t("unpaid")})\n\n`;
  body+=`${s.salonName}\n${s.phone||""}`;
  window.location.href=`mailto:${encodeURIComponent(c?c.email:"")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  toast(t("tOpeningEmail"),"ok");
}

function vReports(el){
  const paid=DB.invoices.filter(i=>i.status==="paid");
  const days=[]; for(let i=6;i>=0;i--) days.push(daysAgoISO(i));
  const dayRev=days.map(d=>({d,v:paid.filter(i=>i.date===d).reduce((s,i)=>s+i.total,0)}));
  const maxDay=Math.max(1,...dayRev.map(x=>x.v));
  const svc={}; paid.forEach(i=>i.items.forEach(it=>{if(it.type==="service")svc[it.name]=(svc[it.name]||0)+it.price*it.qty;}));
  const svcArr=Object.entries(svc).sort((a,b)=>b[1]-a[1]).slice(0,8); const maxSvc=Math.max(1,...svcArr.map(x=>x[1]));
  const staffRev=DB.staff.map(s=>({name:s.name,v:paid.reduce((sum,i)=>sum+i.items.filter(it=>it.staffId===s.id).reduce((a,it)=>a+it.price*it.qty,0),0),comm:s.commission||0})).sort((a,b)=>b.v-a.v);
  const maxStaff=Math.max(1,...staffRev.map(x=>x.v));
  const totalRev=paid.reduce((s,i)=>s+i.total,0);
  const totalTax=paid.reduce((s,i)=>s+i.tax,0);
  const totalTips=paid.reduce((s,i)=>s+(i.tip||0),0);
  const onlineCount=DB.appointments.filter(a=>a.source==="online").length;
  el.innerHTML=`
  <div class="grid kpis" style="margin-bottom:18px">
    <div class="kpi"><div class="lbl">${t("revenue")} (${t("allTime")})</div><div class="val">${money(totalRev)}</div><div class="sub">${paid.length} ${t("paidInvoices")}</div></div>
    <div class="kpi"><div class="lbl">${t("taxCollected")}</div><div class="val">${money(totalTax)}</div><div class="sub">${DB.settings.taxLabel}</div></div>
    <div class="kpi"><div class="lbl">${t("avgTicket")}</div><div class="val">${money(paid.length?totalRev/paid.length:0)}</div><div class="sub">${t("perInvoice")}</div></div>
    <div class="kpi"><div class="lbl">${t("tips")}</div><div class="val">${money(totalTips)}</div><div class="sub">${t("allTime")}</div></div>
    <div class="kpi"><div class="lbl">${t("appointments")}</div><div class="val">${DB.appointments.filter(a=>a.status==="completed").length}</div><div class="sub">${t("completed")}</div></div>
    <div class="kpi"><div class="lbl">${t("bookOnline")}</div><div class="val">${onlineCount}</div><div class="sub">${t("onlineBadge")}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card pad"><div class="section-head"><h2>${t("revenue")} — ${t("last7")}</h2></div>
      <div style="display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px">
      ${dayRev.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
        <div style="font-size:11px;font-weight:700">${x.v?money(x.v).replace(/\.00$/,""):""}</div>
        <div style="width:100%;background:linear-gradient(180deg,var(--primary),#b18bff);border-radius:6px 6px 0 0;height:${Math.round(x.v/maxDay*130)+2}px"></div>
        <div class="muted" style="font-size:11px">${new Date(x.d).toLocaleDateString(DB.settings.lang==="ar"?"ar-AE":"en-US",{weekday:"short"})}</div></div>`).join("")}
      </div></div>
    <div class="card pad"><div class="section-head"><h2>${t("byService")}</h2></div>
      ${svcArr.length?svcArr.map(([n,v])=>`<div class="bar-row"><div class="name" title="${esc(n)}">${esc(n)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxSvc*100)}%"></div></div>
        <div class="bar-val">${money(v)}</div></div>`).join(""):emptyBlock("📈",t("noData"))}</div>
  </div>
  <div class="card pad" style="margin-top:16px"><div class="section-head"><h2>${t("topStaff")}</h2></div>
    ${staffRev.length?`<div class="t-wrap"><table><thead><tr><th>${t("staffMember")}</th><th>${t("revenue")}</th><th>${t("commission")}</th><th>${t("estCommission")}</th><th style="width:35%"></th></tr></thead><tbody>
    ${staffRev.map(s=>`<tr><td><div class="row" style="gap:9px"><div class="avatar">${initials(s.name)}</div>${esc(s.name)}</div></td>
      <td><b>${money(s.v)}</b></td><td>${s.comm}%</td><td>${money(s.v*s.comm/100)}</td>
      <td><div class="bar-track"><div class="bar-fill" style="width:${Math.round(s.v/maxStaff*100)}%"></div></div></td></tr>`).join("")}
    </tbody></table></div>`:emptyBlock("👥",t("noTeam"))}
  </div>`;
}

/* ===== SalonPro Cloud module (baked in) ===== */
/* ============================================================
   SalonPro — Cloud module (Tier 2)
   Optional. Add this ONE line just before </body> in SalonPro.html
   when you host it with cloud sync:

       <script src="salonpro-cloud.js"><\/script>

   It loads the Supabase client from a CDN and implements the
   window.SalonProCloud interface that SalonPro.html calls into.
   The main app stays 100% standalone if this file is absent.

   Setup steps are in SETUP-CLOUD.md.
   ============================================================ */
(function () {
  "use strict";
  var CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  var sb = null, pushTimer = null, subscribed = false;

  function bridge()   { return window.SalonPro || {}; }
  function cfg()      { var s = bridge().settings ? bridge().settings() : {}; return (s && s.cloud) || {}; }
  function isPublic() { return location.hash.slice(1) === "book"; }

  function loadLib() {
    return new Promise(function (res, rej) {
      if (window.supabase) return res();
      var s = document.createElement("script");
      s.src = CDN; s.onload = function(){ res(); }; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  function client() {
    return loadLib().then(function () {
      var c = cfg();
      if (!sb && c.url && c.key) sb = window.supabase.createClient(c.url, c.key);
      return sb;
    });
  }

  /* ---- connection test (used by the "Test connection" button) ---- */
  function init() {
    return client().then(function (c) {
      if (!c) return false;
      return c.from("booking_config").select("salon_id").limit(1).then(function (r) {
        return !r.error || r.error.code === "PGRST116"; // reachable (even if empty)
      });
    }).catch(function(){ return false; });
  }

  /* ---- staff login overlay (email + password) ---- */
  function ensureAuth() {
    return client().then(function (c) {
      if (!c) return null;
      return c.auth.getSession().then(function (r) {
        if (r.data && r.data.session) return r.data.session;
        return promptLogin(c);
      });
    });
  }
  function promptLogin(c) {
    return new Promise(function (resolve) {
      var ov = document.createElement("div");
      ov.style.cssText = "position:fixed;inset:0;background:rgba(15,17,30,.6);display:flex;align-items:center;justify-content:center;z-index:9999";
      ov.innerHTML =
        '<div style="background:#fff;color:#1c2030;border-radius:14px;padding:24px;width:320px;font-family:sans-serif">' +
        '<h3 style="margin:0 0 12px">Staff sign in</h3>' +
        '<input id="_spEmail" placeholder="Email" style="width:100%;padding:10px;margin-bottom:8px;border:1px solid #ddd;border-radius:8px">' +
        '<input id="_spPass" type="password" placeholder="Password" style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px">' +
        '<button id="_spGo" style="width:100%;padding:10px;background:#7c5cff;color:#fff;border:none;border-radius:8px;font-weight:600">Sign in</button>' +
        '<div id="_spErr" style="color:#e5484d;font-size:12px;margin-top:8px"></div></div>';
      document.body.appendChild(ov);
      ov.querySelector("#_spGo").onclick = function () {
        var email = ov.querySelector("#_spEmail").value.trim();
        var pass  = ov.querySelector("#_spPass").value;
        c.auth.signInWithPassword({ email: email, password: pass }).then(function (r) {
          if (r.error) { ov.querySelector("#_spErr").textContent = r.error.message; return; }
          document.body.removeChild(ov); resolve(r.data.session);
        });
      };
    });
  }

  /* ---- admin: pull / push full state ---- */
  function pull() {
    return client().then(function (c) {
      if (!c) return;
      return c.from("salon_state").select("state").eq("id", cfg().salonId).maybeSingle()
        .then(function (r) { if (r.data && r.data.state) bridge().applyState(r.data.state); });
    });
  }
  function onSave(DB) {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { push(DB); }, 1200); // debounce writes
  }
  function push(DB) {
    return client().then(function (c) {
      return c.from("salon_state").upsert({ id: cfg().salonId, state: DB, updated_at: new Date().toISOString() })
        .then(function () { return publishBookingConfig(DB); });
    }).catch(function(){});
  }
  function publishBookingConfig(DB) {
    var s = DB.settings;
    var row = {
      salon_id: cfg().salonId,
      config: {
        salonName: s.salonName, logo: s.logo, intro: s.bookingIntro, hours: s.hours,
        slot: s.bookingSlotMinutes, currency: s.currency, currencySymbol: s.currencySymbol,
        taxRate: s.taxRate, taxLabel: s.taxLabel, bookingEnabled: s.bookingEnabled,
        depositEnabled: s.depositEnabled, depositPct: s.depositPct, payLink: s.payLink,
        services: (DB.services || []).map(function (x) { return { id:x.id, name:x.name, category:x.category, duration:x.duration, price:x.price }; }),
        staff:    (DB.staff || []).map(function (x)   { return { id:x.id, name:(x.name||"").split(" ")[0], role:x.role }; })
      },
      updated_at: new Date().toISOString()
    };
    return client().then(function (c) { if (!c) return; return c.from("booking_config").upsert(row); });
  }

  /* ---- admin boot: auth, pull, live-sync, watch for requests ---- */
  function onBoot() {
    if (isPublic()) return Promise.resolve();
    return ensureAuth().then(function (session) {
      if (!session || !sb) return;
      return pull().then(function () {
        if (!subscribed) {
          subscribed = true;
          sb.channel("state_" + cfg().salonId)
            .on("postgres_changes",
              { event: "*", schema: "public", table: "salon_state", filter: "id=eq." + cfg().salonId },
              function (payload) { if (payload.new && payload.new.state) bridge().applyState(payload.new.state); })
            .subscribe();
          setInterval(pollRequests, 60000);
          pollRequests();
        }
      });
    }).catch(function(){});
  }
  function pollRequests() {
    fetchRequests().then(function (rows) {
      if (bridge().setRequests) bridge().setRequests(rows);
      if (rows && rows.length) bridge().toast(rows.length + " online booking request(s)", "ok");
    }).catch(function(){});
    fetchReviews().then(function (rows) { if (bridge().setReviews) bridge().setReviews(rows); }).catch(function(){});
  }
  function fetchReviews() {
    return client().then(function (c) {
      if (!c) return [];
      return c.from("reviews").select("*").eq("salon_id", cfg().salonId).order("created_at", { ascending: false })
        .then(function (r) { return (r.data || []).map(function (x) { return { id: x.id, name: x.name, rating: x.rating, text: x.text, date: (x.created_at || "").slice(0, 10) }; }); });
    });
  }
  function submitReview(payload) {
    return client().then(function (c) {
      if (!c) throw new Error("not configured");
      return c.from("reviews").insert({ salon_id: cfg().salonId, name: payload.name, rating: payload.rating, text: payload.text || "", created_at: new Date().toISOString() })
        .then(function (r) { if (r.error) throw r.error; return true; });
    });
  }
  function fetchRequests() {
    return client().then(function (c) {
      if (!c) return [];
      return c.from("booking_requests").select("*").eq("salon_id", cfg().salonId).eq("status", "pending")
        .order("created_at", { ascending: true }).then(function (r) { return r.data || []; });
    });
  }
  function updateRequest(id, status) {
    return client().then(function (c) {
      if (!c) return null;
      return c.from("booking_requests").update({ status: status }).eq("id", id);
    }).catch(function(){});
  }
  function acceptRequest(id) { return updateRequest(id, "accepted"); }

  /* ---- public booking page ---- */
  function fetchBookingConfig() {
    return client().then(function (c) {
      if (!c) return null;
      return c.from("booking_config").select("config").eq("salon_id", cfg().salonId).maybeSingle()
        .then(function (r) { return r.data ? r.data.config : null; });
    });
  }
  function submitBooking(payload) {
    return client().then(function (c) {
      if (!c) throw new Error("not configured");
      return c.from("booking_requests").insert({git 
        salon_id: cfg().salonId, payload: payload, status: "pending", created_at: new Date().toISOString()
      }).then(function (r) { if (r.error) throw r.error; return true; });
    });
  }

  window.SalonProCloud = {
    init: init, onSave: onSave, onBoot: onBoot,
    fetchBookingConfig: fetchBookingConfig, submitBooking: submitBooking,
    fetchRequests: fetchRequests, acceptRequest: acceptRequest, updateRequest: updateRequest, publishBookingConfig: publishBookingConfig,
    submitReview: submitReview, fetchReviews: fetchReviews
  };
})();
